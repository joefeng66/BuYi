# Build on the Mac; this workflow validates and deploys only a reviewed dist snapshot.
# No push trigger: uploading source code never starts a Pages deployment.
name: Deploy reviewed local dist

on:
  workflow_dispatch:
    inputs:
      dist_commit:
        description: "Full commit SHA of the approved dist-only pages-dist snapshot"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Validate snapshot identifier
        env:
          DIST_COMMIT: ${{ inputs.dist_commit }}
        run: |
          [[ "$DIST_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "dist_commit must be a full 40-character Git commit SHA" >&2
            exit 1
          }

      - name: Checkout release verifier from the selected workflow ref
        uses: actions/checkout@v6
        with:
          path: tooling
          sparse-checkout: scripts/verify_release.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Checkout the Mac-built dist-only snapshot
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.dist_commit }}
          path: dist
          fetch-depth: 0
          persist-credentials: false

      - name: Require the snapshot to belong to pages-dist
        env:
          DIST_COMMIT: ${{ inputs.dist_commit }}
        run: |
          git -C dist show-ref --verify refs/remotes/origin/pages-dist
          git -C dist merge-base --is-ancestor "$DIST_COMMIT" origin/pages-dist
          # Keep Git metadata outside the directory to be uploaded and verified.
          mv dist/.git .dist-checkout-git

      - name: Verify privacy, publication choices, hashes and the BuYi subpath
        run: python3 tooling/scripts/verify_release.py dist --base-path /BuYi/ --require-approved

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload only the reviewed dist directory
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: validate-and-upload
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
